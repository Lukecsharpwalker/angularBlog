<nav
  #navbar
  id="navbar"
  class="sticky top-0 left-0 right-0 z-10 flex items-center justify-center px-4 py-2 bg-white/70 backdrop-blur-md shadow-lg transition-all duration-500 ease-in-out w-full rounded-none md:top-5 md:w-9/10 md:mx-auto md:rounded-4xl lg:w-4/5 xl:w-17/25"
  [class.scrolled]="isScrolled()"
>
  <div class="grid w-full grid-cols-3 items-center">
    <div class="flex items-center justify-self-start">
      <button class="btn btn-secondary btn-sm md:hidden mr-2" (click)="toggleMenu()">
        <shared-icon class="flex" name="menu" size="sm" />

      </button>

      <div class="hidden md:block">
        <input
          type="text"
          placeholder="Search..."
          class="px-4 py-2 form-input resize-none
                 rounded-full max-w-64"
        />
      </div>
    </div>

    <div class="justify-self-center text-center">
      <a routerLink="/" class="focus-ring block">
        <h1 class="text-lg font-bold mb-0 pb-0">Angular.fun</h1>
        <h2 class="text-xs sm:text-sm mt-0 pt-0">Bring the fun back to coding</h2>
      </a>
    </div>

    @if (userName()) {
      <div class="flex items-center justify-self-end space-x-4">
        <span class="text-xs text-ink-2">Hello, {{userName()}}</span>
        <button
          class="btn btn-primary hidden md:inline-block px-6 py-2 rounded-full shadow-xs hover:shadow-md"
          (click)="logout()"
        >
          Sign Out
        </button>
      </div>
    } @else {
      <div class="flex items-center justify-self-end">
        <button
          class="btn btn-primary hidden md:inline-block px-6 py-2 rounded-full shadow-xs hover:shadow-md"
          (click)="signIn()"
        >
          Sign In
        </button>
      </div>
    }
  </div>

  @if (isMenuOpen()) {
    <div
      #mobileMenu
      class="absolute left-0 w-full bg-white/90 transition-all duration-500 ease-in-out p-4 md:hidden"
    >
      <div class="flex flex-col items-start space-y-4">
        <input
          type="text"
          placeholder="Search ..."
          class="w-full px-4 py-3 form-input rounded-xl"
        />
        <button
          class="btn btn-primary w-full py-3 px-4 rounded-xl"
          (click)="signIn()"
        >
          Sign In
        </button>
      </div>
    </div>
  }
</nav>
