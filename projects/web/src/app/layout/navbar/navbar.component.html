<nav
  #navbar
  id="navbar"
  class="navbar-neon-hover fixed top-0 left-0 right-0 z-10 flex items-center justify-center px-4 py-2 bg-white/70 backdrop-blur-md shadow-lg transition-all duration-500 ease-in-out <!-- Mobile styles (default) --> w-full rounded-none <!-- Medium+ styles --> md:top-5 md:w-[90%] md:mx-auto md:rounded-[2rem] lg:w-[80%] xl:w-[68%]"
  [class.scrolled]="isScrolled()"
>
  <div class="grid w-full grid-cols-[1fr_auto_1fr] items-center">
    <div class="flex items-center justify-self-start">
      <button class="btn-tertiary btn-tertiary-sm md:hidden mr-2" (click)="toggleMenu()">
        Menu
      </button>

      <div class="hidden md:block">
        <input
          type="text"
          placeholder="Search posts..."
          class="px-4 py-2 bg-white/80 backdrop-blur-sm border-2 border-gray-200/60
                 rounded-full w-64 focus:outline-none focus:border-primary
                 transition-all duration-300 text-sm
                 placeholder-gray-400 hover:border-gray-300/80"
        />
      </div>
    </div>

    <div class="justify-self-center">
      <div class="flex items-center cursor-pointer text-center" [routerLink]="['/']">
        <div>
          <h1 class="text-lg font-bold mb-0 pb-0">Angular.fun</h1>
          <h2 class="text-xs sm:text-sm mt-0 pt-0">Bring the fun back to coding</h2>
        </div>
      </div>
    </div>

    @if (userName()) {
      <div class="flex items-center justify-self-end space-x-4">
        <span class="text-xs text-gray-700">Hello, {{userName()}}</span>
        <button
          class="hidden md:inline-block btn btn-primary px-6 py-2 rounded-full
               transform hover:scale-[1.02] active:scale-[0.98] shadow-sm hover:shadow-md"
          (click)="logout()"
        >
          Sign Out
        </button>
      </div>
    } @else {
      <div class="flex items-center justify-self-end">
        <button
          class="hidden md:inline-block btn btn-primary px-6 py-2 rounded-full
               transform hover:scale-[1.02] active:scale-[0.98] shadow-sm hover:shadow-md"
          (click)="signIn()"
        >
          Sign In
        </button>
      </div>
    }
  </div>

  @if (isMenuOpen()) {
    <div
      #mobileMenu
      class="absolute left-0 w-full bg-white/90 transition-all duration-500 ease-in-out p-4 md:hidden"
    >
      <div class="flex flex-col items-start space-y-4">
        <input
          type="text"
          placeholder="Search posts..."
          class="w-full px-4 py-3 bg-white border-2 border-gray-200 rounded-xl
                 focus:outline-none focus:border-primary
                 transition-all duration-300 text-gray-900 placeholder-gray-400"
        />
        <button
          class="w-full btn btn-primary py-3 px-4 rounded-xl
                 transform hover:scale-[1.02] active:scale-[0.98]"
          (click)="signIn()"
        >
          Sign In
        </button>
      </div>
    </div>
  }
</nav>
