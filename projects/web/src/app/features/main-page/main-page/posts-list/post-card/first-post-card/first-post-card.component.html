<article
  class="card shadow-sm overflow-hidden mb-4 hover-lift-subtle antialiased md:border-0 md:shadow-md md:rounded-3xl md:mb-6"
>
  <a
    [routerLink]="['/post', post().id]"
    [attr.aria-label]="post().title"
    class="flex flex-col focus-ring md:flex-row md:items-center md:gap-8 md:px-7 md:py-5"
  >
    <div
      class="order-2 flex flex-1 flex-col items-start gap-3 p-5 md:order-1 md:self-stretch md:gap-4 md:p-0"
    >
      <div class="flex flex-wrap gap-2">
        @for (tag of post().tags; track tag.id) {
          <shared-chip [text]="tag.name" [color]="tag.color" variant="outline" />
        }
      </div>

      <web-post-card-body
        [title]="post().title"
        [description]="post().description"
        [createdAt]="post().created_at"
        [featured]="true"
      />
    </div>

    <div
      class="relative order-1 h-44 shrink-0 bg-linear-to-br from-tertiary/40 to-quaternary md:order-2 md:h-auto md:w-80 md:aspect-3/2 md:overflow-hidden md:rounded-2xl"
    >
      <img
        class="object-cover"
        [ngSrc]="post().cover_image!"
        [alt]=""
        fill
        priority
        sizes="(min-width: 768px) 20rem, 100vw"
      />
    </div>
  </a>
</article>
