<article
  class="bg-surface-1 shadow-sm w-full rounded-2xl overflow-hidden mb-4 hover-lift-subtle antialiased will-change-transform"
>
  <a
    [routerLink]="['/post', post().id]"
    [attr.aria-label]="post().title"
    class="flex flex-col md:flex-row gap-4 md:gap-8 py-4 md:py-6 md:pr-8 focus-ring"
  >
    <div class="flex flex-wrap md:flex-col items-start gap-2 px-6 md:px-0 md:w-40 md:shrink-0">
      @for (tag of post().post_tags; track tag.tags.id; let i = $index) {
        <!--          TODO: REFACTOR WHEN Adjustin mobile page-->
        <div class="md:hidden">
          <shared-chip [text]="tag.tags.name" [color]="tag.tags.color" variant="outline" />
        </div>
        @if (i < 4) {
          <div class="hidden md:block">
            <web-label [text]="tag.tags.name" [color]="tag.tags.color" />
          </div>
        }
      }
    </div>

    <div class="flex flex-1 flex-col items-start gap-3 px-6 md:px-0">
      <h2 class="text-xl font-bold leading-snug text-primary line-clamp-2">
        {{ post().title }}
      </h2>

      <p class="leading-relaxed text-ink-2 line-clamp-3">
        {{ post().description }}
      </p>

      <div class="flex items-center gap-4 mt-auto">
        @if (post().created_at; as createdAt) {
          <time class="text-sm font-semibold text-ink-3" [attr.datetime]="createdAt">
            {{ createdAt | date: 'mediumDate' }}
          </time>
        }
        <span class="inline-flex items-center gap-1 text-sm font-bold text-secondary">
          Read
          <shared-icon class="flex" name="arrow-right" size="sm" />
        </span>
      </div>
    </div>
  </a>
</article>
