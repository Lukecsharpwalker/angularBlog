<div class="relative mt-8 pb-4" data-testid="tags-container">
  <div class="glass-effect-light p-4 sm:p-5 rounded-2xl relative shadow-xs">
    <div
      #scrollContainer
      data-testid="tags-scroll-container"
      class="overflow-x-auto overflow-y-hidden py-3 hide-scrollbar whitespace-nowrap scroll-smooth"
    >
      <div class="inline-flex space-x-2 md:space-x-6" data-testid="tags-list">
        @for (tag of tags() || []; track tag.id) {
          <div class="flex flex-col items-center w-20 md:w-24 group transform-gpu backface-hidden" data-testid="tag-item"
               [attr.data-tag-name]="tag.name">
            <div
              [style.background-color]="tag.color"
              class="w-14 h-14 md:w-16 md:h-16 rounded-2xl flex items-center justify-center hover-lift-subtle cursor-pointer shadow-xs"
              data-testid="tag-button"
            >
              <img
                ngSrc="tags/{{ tag.icon }}"
                [alt]="tag.name"
                class="w-7 h-7 md:w-8 md:h-8 transform-gpu"
                width="32"
                height="32"
                data-testid="tag-icon"
              />
            </div>
            <span
              class="mt-2 text-center text-ink-2 text-xs md:text-sm font-medium leading-tight"
              data-testid="tag-name"
            >{{ tag.name }}</span>
          </div>
        }
      </div>
    </div>

    <button
      (click)="scrollBy('left')"
      class="icon-badge group absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 backdrop-blur-xs shadow-xs border-2 border-edge-1 hover:bg-secondary/10 hover:border-secondary/40 hover:scale-110 transition-all duration-200 hidden md:flex text-ink-2 cursor-pointer"
      data-testid="scroll-left-button"
      aria-label="Scroll tags left"
    >
      <svg class="w-4 h-4 group-hover:text-secondary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <button
      (click)="scrollBy('right')"
      class="icon-badge group absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 bg-white/80 backdrop-blur-xs shadow-xs border-2 border-edge-1 hover:bg-secondary/10 hover:border-secondary/40 hover:scale-110 transition-all duration-200 hidden md:flex text-ink-2 cursor-pointer"
      data-testid="scroll-right-button"
      aria-label="Scroll tags right"
    >
      <svg class="w-4 h-4 group-hover:text-secondary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  <div class="mt-3 md:hidden w-full flex justify-center space-x-1" data-testid="mobile-scroll-indicator">
    @for (dotClass of activeDotClasses(); track $index) {
      <div class="w-1.5 h-1.5 rounded-full transition-all duration-300" [class]="dotClass"></div>
    }
  </div>
</div>
