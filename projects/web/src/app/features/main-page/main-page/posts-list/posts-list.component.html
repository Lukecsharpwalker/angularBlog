<web-about-me/>
<web-tags-scroll [tags]="tags()"/>

<div class="flex justify-center mt-5">
  <div class="w-full">
    <div class="grid">
      @for (post of posts(); track post.id; let first = $first) {
        @if (first) {
          <web-first-post-card [post]="post"/>
        } @else {
          <web-post-card [post]="post"/>
        }
      }
    </div>
  </div>
</div>
