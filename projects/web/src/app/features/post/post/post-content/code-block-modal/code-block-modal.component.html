<div class="w-full h-full overflow-auto">
  <pre
    data-dialog-transition
    [class]="'language-' + data?.language"
    class="h-full max-h-60vh hljs code-block font-mono scrollbar-thin scrollbar-thumb-white/30 scrollbar-track-white/10 p-3 sm:p-4 md:p-6 rounded-xl text-xs sm:text-sm md:text-base leading-5 sm:leading-6 w-full min-h-full overflow-x-auto whitespace-pre"
  >
    <code [innerHTML]="$safeNavigationMigration(data?.code)" class=" block text-left"></code>
  </pre>
</div>

<button
  type="button"
  class="btn btn-icon btn-secondary fixed right-4 bottom-safe-bottom z-50 md:hidden"
  aria-label="Close code dialog"
  (click)="close()"
>
  <shared-icon name="close" size="sm" />
</button>
