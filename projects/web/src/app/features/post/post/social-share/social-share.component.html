<button
  type="button"
  class="btn btn-icon btn-secondary"
  aria-label="Share article on X"
  (click)="shareOn('twitter')"
>
  <span class="text-lg font-bold leading-none">X</span>
</button>

<button
  type="button"
  class="btn btn-icon btn-secondary"
  aria-label="Share article on LinkedIn"
  (click)="shareOn('linkedin')"
>
  <shared-icon class="flex" name="linkedin" size="lg" />
</button>

<button
  type="button"
  class="btn btn-icon btn-secondary"
  aria-label="Copy article link to clipboard"
  (click)="copyLink()"
>
  <shared-icon class="flex" name="link" size="lg" />
</button>
