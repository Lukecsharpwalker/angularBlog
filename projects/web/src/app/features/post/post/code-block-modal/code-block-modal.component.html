<div
  class="h-full w-80vw min-h-40 max-h-60vh md:max-h-70vh sm:max-h-80vh overflow-auto"
>
  <pre
    [class]="'language-' + data?.language + ' hljs code-block'"
    class="p-3 sm:p-4 md:p-6 rounded-xl text-xs sm:text-sm md:text-base leading-5 sm:leading-6 w-full min-h-full box-border overflow-x-auto overflow-y-visible whitespace-pre break-normal"

  >
    <code [innerHTML]="data?.code" class="block text-left"></code>
  </pre>
</div>
