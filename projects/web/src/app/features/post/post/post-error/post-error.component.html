<div class="px-4 py-20">
  <div
    class="max-w-md mx-auto text-center glass-effect-strong border border-error/40 rounded-xl p-8 shadow-lg"
  >
    <h2 class="text-2xl font-bold text-error mb-2 flex items-center justify-center gap-2">
      <shared-icon name="error" size="sm" />
      Error Loading Post
    </h2>
    <p class="text-ink-2 mb-6">{{ error() }}</p>

    <div class="space-y-3">
      <button
        class="btn btn-primary w-full hover-lift"
        (click)="retryRequested.emit()"
        aria-label="Retry loading post"
      >
        Try Again
      </button>

      <button
        class="btn btn-secondary w-full"
        (click)="backRequested.emit()"
        aria-label="Go back to posts list"
      >
        Back to Posts
      </button>
    </div>
  </div>
</div>
