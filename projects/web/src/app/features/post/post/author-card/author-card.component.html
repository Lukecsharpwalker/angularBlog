<div class="card card-lg flex items-start gap-5">
  <shared-avatar
    [name]="author()?.username"
    [imageUrl]="author()?.avatar_url"
    size="lg"
    type="square-rounded"
  />
  <div class="flex-1 min-w-0">
    <div class="text-xs font-bold uppercase tracking-wider text-accent mb-1">Written by</div>
    <h3 class="font-bold text-lg text-primary mb-1">{{ author()?.username }}</h3>
    <p class="text-sm text-ink-3 leading-relaxed">
      <!--       TODO: Add author bio to the user model and display it here.-->
      Software developer and big Angular fan. Writing about the web, one experiment at a time.
    </p>
  </div>
  <button type="button" class="btn btn-secondary btn-sm shrink-0">Follow</button>
</div>
