<span
  aria-hidden="true"
  class="absolute inset-y-0 left-1/2 w-screen -translate-x-1/2 bg-surface"
></span>
<a
  routerLink="/"
  aria-label="Back to all posts"
  class="relative flex size-10 items-center justify-center rounded-full border border-edge-1 bg-surface-1 text-secondary transition-transform duration-1000 ease-out focus-ring"
>
  <shared-icon class="flex" name="arrow-left" size="sm" />
</a>

@if (hasContents()) {
  <button
    type="button"
    aria-haspopup="dialog"
    class="btn btn-secondary btn-sm relative ml-auto min-h-11 gap-2 rounded-full transition-transform duration-1000 ease-out"
    (click)="contentsRequested.emit()"
  >
    <shared-icon class="flex" name="menu" size="sm" />
    Contents
  </button>
}
