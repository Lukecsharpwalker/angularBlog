<nav aria-label="Table of contents">
  <ul class="border-l border-edge-1">
    @for (item of items(); track item.id) {
      <li>
        <button
          type="button"
          (click)="scrollToSection(item.id)"
          [attr.data-toc-active]="activeId() === item.id"
          [style.--toc-level]="item.header"
          class="toc-link block w-full text-left py-1 transition-colors focus-ring"
        >
          {{ item.content }}
        </button>
      </li>
    }
  </ul>
</nav>
