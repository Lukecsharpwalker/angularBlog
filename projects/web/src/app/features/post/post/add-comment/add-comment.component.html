<form [formGroup]="commentForm" (ngSubmit)="onSubmit()">
  <label for="comment-content" class="sr-only">Add a comment</label>
  <textarea
    id="comment-content"
    formControlName="content"
    class="form-input resize-none"
    rows="3"
    aria-describedby="comment-content-feedback"
    [attr.aria-invalid]="
      commentForm.controls.content.touched && commentForm.controls.content.invalid
    "
  ></textarea>

  <div class="flex justify-between items-center gap-4 mt-3">
    <div id="comment-content-feedback" class="text-xs text-ink-3">
      {{ commentForm.controls.content.value.length }}/500 characters
    </div>

    <button
      type="submit"
      class="btn btn-primary btn-sm rounded-full px-5 disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="commentForm.invalid || isSubmitting()"
    >
      @if (isSubmitting()) {
        <span class="flex items-center gap-2">
          <span class="spinner w-4 h-4 border-2 border-white/30 border-t-white"></span>
          Publishing...
        </span>
      } @else {
        Post comment
      }
    </button>
  </div>
</form>
