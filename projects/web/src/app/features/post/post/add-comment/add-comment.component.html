<form [formGroup]="commentForm" (ngSubmit)="onSubmit()">
  <div class="mb-4">
    <textarea
      id="content"
      formControlName="content"
      class="w-full p-4 bg-white/90 backdrop-blur-sm border border-white/40 rounded-lg text-primary placeholder-primary/50 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary focus:bg-white transition-all duration-200 resize-none shadow-sm"
      rows="4"
      placeholder="Share your thoughts about this article..."
      [class.border-red-400]="commentForm.get('content')?.touched && commentForm.get('content')?.invalid"
    ></textarea>

    <div class="flex justify-between items-center mt-2">
      <div class="flex items-center gap-2">
        <div class="text-xs text-primary/50">
          {{ commentForm.get('content')?.value?.length || 0 }}/500 characters
        </div>
        @if (commentForm.get('content')?.valid && commentForm.get('content')?.value?.length > 0) {
          <div class="w-2 h-2 bg-green-500 rounded-full"></div>
        }
      </div>

      @if (commentForm.get('content')?.touched && commentForm.get('content')?.errors) {
        <div class="text-sm text-red-500">
          Comment is required
        </div>
      }
    </div>
  </div>

  <div class="flex justify-end">
    <button
      type="submit"
      class="btn btn-primary disabled:opacity-50 disabled:cursor-not-allowed shadow-md hover:shadow-lg transition-all duration-200 px-6"
      [disabled]="commentForm.invalid || isSubmitting()"
    >
      @if (isSubmitting()) {
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          <span>Publishing...</span>
        </div>
      } @else {
        Publish Comment
      }
    </button>
  </div>
</form>
