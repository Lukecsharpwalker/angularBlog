<div class="space-y-4">
  @for (comment of comments(); track comment.id) {
    <div class="card card-padded flex items-start gap-4">
      <shared-avatar
        [name]="comment.author?.username"
        [imageUrl]="comment.author?.avatar_url"
        size="sm"
      />

      <div class="flex-1 min-w-0">
        <div class="flex items-baseline gap-2.5 mb-1.5">
          <span class="font-bold text-sm text-primary">{{ comment.author?.username }}</span>
          <time class="text-xs text-ink-3" [attr.datetime]="comment.created_at">
            {{ (comment.created_at | date: 'mediumDate') || 'Unknown time' }}
          </time>
        </div>

        <p class="text-sm leading-relaxed text-ink-2 break-words">
          {{ comment.content }}
        </p>
      </div>

      <button
        *webHasRole="Roles.ADMIN"
        class="btn btn-danger btn-sm shrink-0"
        (click)="deleteComment(comment.id)"
        aria-label="Delete comment"
      >
        Delete
      </button>
    </div>
  } @empty {
    <div class="card px-4 py-10 text-center">
      <h3 class="mb-1 font-bold text-primary">No comments yet</h3>
      <p class="text-sm text-ink-3">Be the first to share your thoughts on this article.</p>
    </div>
  }
</div>
