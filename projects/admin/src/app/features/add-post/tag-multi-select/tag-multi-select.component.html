<div class="w-full">
  @if (selectedTags().length > 0) {
    <div class="flex flex-wrap gap-2 mb-3 min-h-8">
      @for (tag of selectedTags(); track tag.id) {
        <shared-chip
          [text]="tag.name"
          [color]="tag.color"
          (click)="removeTag(tag)"
          (keydown.enter)="removeTag(tag)"
        >
          <svg class="size-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </shared-chip>
      }
    </div>
  }

  <div cdkOverlayOrigin #origin="cdkOverlayOrigin" #originEl>
    <input
      type="text"
      class="w-full px-4 py-2.5 border border-edge-2 rounded-xl text-sm bg-surface-2 text-ink-1 transition-colors duration-200 focus:border-primary focus:bg-surface-1 focus:outline-hidden placeholder:text-ink-3 disabled:opacity-50 disabled:cursor-not-allowed"
      placeholder="Search and add tags..."
      [value]="searchTerm()"
      (input)="onSearchChange($event)"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      [disabled]="disabled()"
      [attr.aria-expanded]="isOpen()"
      aria-haspopup="listbox"
      aria-label="Search tags"
    />
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="isOpen() && !disabled()"
    [cdkConnectedOverlayWidth]="originEl.offsetWidth"
    [cdkConnectedOverlayPositions]="overlayPositions"
  >
    <div
      class="w-full bg-surface-1 border border-tertiary/30 rounded-lg shadow-lg shadow-primary/15 max-h-60 overflow-y-auto p-1 animate-slide-down no-scrollbar"
      role="listbox"
      aria-label="Available tags"
      (mousedown)="$event.preventDefault()"
    >
      @for (tag of filteredTags(); track tag.id) {
        <div
          class="flex items-center justify-between p-3 rounded-md cursor-pointer transition-all duration-150"
          [class]="
            tag.id === focusedTagId()
              ? 'bg-primary text-ink-inverse'
              : 'text-primary hover:bg-tertiary/10'
          "
          (click)="selectTag(tag)"
          (keydown.enter)="selectTag(tag)"
          aria-selected="false"
          role="option"
          tabindex="-1"
        >
          <div class="flex items-center gap-2 flex-1">
            <span class="text-sm font-medium">{{ tag.name }}</span>
            @if (tag.color) {
              <div
                class="size-3 rounded-full border shrink-0"
                [style.background-color]="tag.color"
                [class]="tag.id === focusedTagId() ? 'border-white' : 'border-tertiary/30'"
              ></div>
            }
          </div>
          <div
            class="text-xs transition-colors duration-150"
            [class]="tag.id === focusedTagId() ? 'text-ink-inverse' : 'text-secondary/60'"
          >
            Add
          </div>
        </div>
      } @empty {
        <div class="flex flex-col items-center justify-center p-6 text-secondary/60 text-center">
          <span class="text-sm italic">No tags found</span>
        </div>
      }
    </div>
  </ng-template>
</div>
