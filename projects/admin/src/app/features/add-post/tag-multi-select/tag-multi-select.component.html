<div class="w-full relative">
  @if (selectedTags().length > 0) {
    <div class="flex flex-wrap gap-2 mb-3 min-h-8">
      @for (tag of selectedTags(); track tag.id) {
        <div
          class="inline-flex items-center gap-2 px-3 py-1.5 text-ink-inverse rounded-full text-sm font-medium cursor-pointer transition-all duration-150 border-none relative hover:-translate-y-0.5 hover:shadow-lg hover:shadow-primary/20 focus-ring"
          [style.background-color]="tag.color || '#12372A'"
          [style.background]="tag.color && tag.color !== '#12372A' ? tag.color : 'rgba(18, 55, 42, 0.9)'"
          (click)="removeTag(tag)"
          [attr.aria-label]="'Remove ' + tag.name"
          role="button"
          tabindex="0"
          (keydown.enter)="removeTag(tag)"
          (keydown.space)="removeTag(tag)"
        >
          <span class="leading-none">{{ tag.name }}</span>
          <button
            class="icon-badge w-4 h-4 bg-white/20 backdrop-blur-xs border-none text-current cursor-pointer text-xs opacity-70 transition-all duration-150 hover:opacity-100 hover:bg-white/30 hover:scale-110"
            type="button" [attr.aria-label]="'Remove ' + tag.name">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      }
    </div>
  }

  <div class="relative">
    <input
      #searchInput
      type="text"
      class="w-full px-4 py-3 border-2 border-tertiary/30 rounded-lg text-sm bg-surface-1 text-primary transition-all duration-200 focus:border-primary focus-ring placeholder:text-secondary/50 disabled:opacity-50 disabled:cursor-not-allowed disabled:bg-tertiary/10"
      placeholder="Search and add tags..."
      [value]="searchTerm()"
      (input)="onSearchChange($event)"
      (focus)="onInputFocus()"
      (blur)="onInputBlur()"
      [disabled]="disabled()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      role="textbox"
      aria-label="Search tags"
    />


    @if (isOpen() && !disabled()) {
      <div
        class="absolute top-full left-0 right-0 z-50 mt-1 bg-surface-1 border border-tertiary/30 rounded-lg shadow-lg shadow-primary/15 max-h-60 overflow-y-auto p-1 animate-slide-down tag-select-scroll"
        role="listbox" [attr.aria-label]="'Available tags'">
        @for (tag of filteredTags(); track tag.id) {
          <div
            class="flex items-center justify-between p-3 rounded-md cursor-pointer transition-all duration-150 text-primary hover:bg-tertiary/10 hover:text-primary"
            [class]="tag.id === focusedTagId() ? 'bg-primary text-ink-inverse' : ''"
            (click)="selectTag(tag)"
            (keydown.enter)="selectTag(tag)"
            (keydown.space)="selectTag(tag)"
            [attr.aria-selected]="isTagSelected(tag)"
            role="option"
            tabindex="-1"
          >
            <div class="flex items-center gap-2 flex-1">
              <span class="text-sm font-medium">{{ tag.name }}</span>
              @if (tag.color) {
                <div class="w-3 h-3 rounded-full border border-tertiary/30 shrink-0"
                     [style.background-color]="tag.color"
                     [class]="tag.id === focusedTagId() ? 'border-white' : ''"></div>
              }
            </div>
            <div class="text-xs transition-colors duration-150"
                 [class]="tag.id === focusedTagId() ? 'text-ink-inverse' : 'text-secondary/60'">
              Add
            </div>
          </div>
        } @empty {
          <div class="flex flex-col items-center justify-center p-6 text-secondary/60 text-center">
            <span class="text-sm italic">No tags found</span>
          </div>
        }
      </div>
    }
  </div>
</div>
