<div class="dialog-content">
  <h3 class="text-lg font-medium mb-4">Insert Image</h3>
  <form [formGroup]="form" >
    <div class="mb-4">
      <label for="src" class="block text-sm font-medium">Image URL</label>
      <input type="text" id="src" formControlName="src" class="w-full px-3 py-2 border border-edge-1 rounded-lg bg-surface-1 text-ink-1 focus:border-primary focus:outline-hidden" placeholder="https://example.com/image.jpg" />
    </div>
    <div class="mb-4">
      <label for="alt" class="block text-sm font-medium">Alt Text</label>
      <input type="text" id="alt" formControlName="alt" class="w-full px-3 py-2 border border-edge-1 rounded-lg bg-surface-1 text-ink-1 focus:border-primary focus:outline-hidden" placeholder="Description of the image" />
    </div>
  </form>
</div>
