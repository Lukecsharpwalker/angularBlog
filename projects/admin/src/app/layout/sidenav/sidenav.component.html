<nav aria-label="Content management" class="flex flex-col gap-1.5 w-80 shrink-0 h-screen sticky top-0 bg-surface-1 border-r border-edge-1 px-4 py-5">
  <a [routerLink]="brandLink" class="focus-ring block px-2.5 pt-1.5 pb-5">
    <span class="block text-lg font-extrabold text-primary leading-tight">Angular.fun</span>
    <span class="block text-xs font-bold text-accent tracking-wider uppercase">Studio</span>
  </a>

  @for (item of items; track item.link) {
    <a
      [routerLink]="item.link"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="nav-link focus-ring"
    >
      <shared-icon [name]="item.icon" size="sm" aria-hidden="true" />
      {{ item.label }}
    </a>
  }
</nav>
