<div class="min-h-screen flex items-center justify-center bg-surface p-4 sm:p-8">
  <h1 class="sr-only">Admin sign in</h1>
  <div class="flex w-full max-w-360 min-h-90vh bg-surface-1 border border-edge-1 rounded-2xl shadow-card overflow-hidden">
    <div class="hidden lg:flex flex-col justify-between relative overflow-hidden w-2/5 shrink-0 bg-primary text-surface p-14">
      <svg
        class="absolute -bottom-18 -right-15 opacity-10"
        width="360"
        height="360"
        viewBox="0 0 200 200"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        aria-hidden="true"
      >
        <circle cx="100" cy="100" r="34" />
        <circle cx="100" cy="100" r="62" />
        <circle cx="100" cy="100" r="90" />
      </svg>

      <div class="relative flex items-center gap-3">
        <span class="text-lg font-extrabold">Angular.fun</span>
        <span class="text-xs font-bold uppercase tracking-widest bg-tertiary/20 text-tertiary rounded px-2 py-1">
          Studio
        </span>
      </div>

      <div class="relative">
        <h2 class="text-4xl font-extrabold leading-tight tracking-tight mb-4">
          The content desk<br />for angular.fun
        </h2>
        <p class="text-base leading-relaxed text-tertiary max-w-sm">
          Write, schedule and publish posts — manage tags, media and comments in one place.
        </p>
      </div>

      <p class="relative text-sm font-semibold text-tertiary">Editors and administrators only</p>
    </div>

    <div class="flex flex-1 items-center justify-center p-8 sm:p-12">
      <shared-auth-form (loginSuccess)="onLoginSuccess()" />
    </div>
  </div>
</div>
