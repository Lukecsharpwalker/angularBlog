<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
  (click)="onOverlayClick()"
  (keyup.escape)="closeDialog()"
>
  <div class="absolute inset-0 glass-overlay-dialog animate-fade-in"></div>

  <div class="relative max-w-md w-full transform-gpu animate-scale-in perspective-1000 modal-container"
       [class.code-modal]="modalConfig()?.title?.includes('Code')"
       (click)="$event.stopPropagation()"
       (keydown)="$event.stopPropagation()"
       tabindex="-1">

    <button
      (click)="closeDialog(); $event.stopPropagation()"
      type="button"
      class="absolute -top-2 -right-2 w-10 h-10 rounded-full bg-white shadow-lg
             hover:bg-red-50 transition-all duration-200 hover:scale-110
             flex items-center justify-center group border-2 border-gray-200
             hover:border-red-300 z-50 cursor-pointer"
      aria-label="Close modal">
      <svg class="w-5 h-5 text-gray-500 group-hover:text-red-500 transition-colors"
           fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <div class="glass-card-dialog rounded-2xl shadow-2xl relative overflow-hidden">

      <div class="absolute inset-0 grain-overlay opacity-5"></div>

      <div class="p-8 relative z-10">
        @if (modalConfig()?.title) {
          <div class="text-center mb-6">
            <h3 class="kinetic-text-lg" id="modal-title">
              {{ modalConfig()?.title }}
            </h3>
            <div class="mx-auto mt-3 w-96 h-px bg-gradient-to-r from-transparent via-gray-300 to-transparent opacity-60"></div>
          </div>
        }

        @if (modalConfig()?.content) {
          <div class="mb-6 text-gray-700">
            {{ modalConfig()?.content }}
          </div>
        }

        <div class="min-h-0">
          <ng-template #dynamicComponentContainer/>
        </div>
      </div>

      @if (modalConfig()?.primaryButton || modalConfig()?.secondaryButton) {
        <div class="px-8 pb-6 flex gap-3 justify-end relative z-10">
          @if (modalConfig()?.secondaryButton) {
            <button
              (click)="closeDialog(ModalCloseStatusEnum.REJECTED)"
              type="button"
              class="btn-glass text-gray-700 hover:text-gray-900"
            >
              {{ modalConfig()?.secondaryButton }}
            </button>
          }
          @if (modalConfig()?.primaryButton) {
            <button
              (click)="closeDialog(ModalCloseStatusEnum.ACCEPTED)"
              type="button"
              class="btn-primary-modern"
            >
              {{ modalConfig()?.primaryButton }}
            </button>
          }
        </div>
      }
  </div>
</div>
