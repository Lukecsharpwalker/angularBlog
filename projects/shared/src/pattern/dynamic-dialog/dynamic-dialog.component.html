<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in"
  aria-labelledby="modal-title"
  role="dialog"
  aria-modal="true"
  (click)="onOverlayClick()"
  (keyup.escape)="closeDialog()"
>
  <div class="absolute inset-0 glass-overlay-dialog"></div>

  <div class="relative max-w-md w-full transform-gpu animate-scale-in perspective-1000"
       (click)="$event.stopPropagation()"
       (keydown)="$event.stopPropagation()"
       tabindex="-1">

    <div class="glass-card-dialog rounded-2xl shadow-2xl relative overflow-hidden">

      <div class="absolute inset-0 grain-overlay opacity-5"></div>

      <button
        (click)="closeDialog()"
        type="button"
        class="absolute top-4 right-4 w-8 h-8 rounded-full bg-gray-100
               hover:bg-red-500/20 transition-all duration-200 hover:rotate-90
               flex items-center justify-center group focus-ring z-10"
        aria-label="Close">
        <svg class="w-4 h-4 text-gray-600 group-hover:text-red-500 transition-colors"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <div class="p-8 relative z-10">
        @if (modalConfig()?.title) {
          <div class="text-center mb-6">
            <h3 class="kinetic-text-lg" id="modal-title">
              {{ modalConfig()?.title }}
            </h3>
            <div class="mx-auto mt-2 w-16 h-0.5 bg-gradient-to-r from-primary via-accent-neon to-accent-electric"></div>
          </div>
        }

        @if (modalConfig()?.content) {
          <div class="mb-6 text-gray-700">
            {{ modalConfig()?.content }}
          </div>
        }

        <div class="min-h-0">
          <ng-template #dynamicComponentContainer/>
        </div>
      </div>

      @if (modalConfig()?.primaryButton || modalConfig()?.secondaryButton) {
        <div class="px-8 pb-6 flex gap-3 justify-end relative z-10">
          @if (modalConfig()?.secondaryButton) {
            <button
              (click)="closeDialog(ModalCloseStatusEnum.REJECTED)"
              type="button"
              class="btn-glass text-gray-700 hover:text-gray-900"
            >
              {{ modalConfig()?.secondaryButton }}
            </button>
          }
          @if (modalConfig()?.primaryButton) {
            <button
              (click)="closeDialog(ModalCloseStatusEnum.ACCEPTED)"
              type="button"
              class="btn-primary-modern"
            >
              {{ modalConfig()?.primaryButton }}
            </button>
          }
        </div>
      }
  </div>
</div>
