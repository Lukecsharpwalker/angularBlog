<shared-dialog-shell
  [variant]="modalConfig().variant"
  [transitionSource]="modalConfig().transitionSource"
  [title]="modalConfig().title"
  [ariaLabel]="modalConfig().ariaLabel ?? 'Dialog'"
  (dismissed)="closeDialog()"
>
  @if (modalConfig().content; as content) {
    <div class="mb-6 text-ink-2">{{ content }}</div>
  }

  @if (modalConfig().image; as image) {
    <img
      [src]="image"
      alt=""
      class="max-h-80vh max-w-95vw object-contain max-md:mx-auto max-md:max-h-full max-md:max-w-full"
    />
  }

  <div class="min-h-0" [class.flex-1]="!!component()">
    <ng-template #dynamicComponentContainer />
  </div>

  <ng-container ngProjectAs="[dialogActions]">
    @if (modalConfig().secondaryButton; as label) {
      <button
        (click)="closeDialog(ModalCloseStatusEnum.REJECTED)"
        type="button"
        class="btn btn-secondary"
      >
        {{ label }}
      </button>
    }
    @if (modalConfig().primaryButton; as label) {
      <button
        (click)="closeDialog(ModalCloseStatusEnum.ACCEPTED)"
        type="button"
        class="btn btn-primary"
      >
        {{ label }}
      </button>
    }
  </ng-container>
</shared-dialog-shell>
