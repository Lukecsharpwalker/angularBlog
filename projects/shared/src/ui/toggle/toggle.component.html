<label class="relative inline-flex min-h-11 items-center gap-3">
  <input
    #toggleInput
    class="absolute inset-0 z-10 m-0 cursor-pointer opacity-0 disabled:cursor-not-allowed"
    type="checkbox"
    role="switch"
    [checked]="isChecked()"
    [disabled]="isDisabled()"
    [attr.aria-label]="hideLabel() ? label() : null"
    [attr.aria-describedby]="describedBy()"
    (change)="onToggle(toggleInput)"
    (blur)="onBlur()"
  />
  <span class="toggle-track relative shrink-0 rounded-full" aria-hidden="true">
    <span class="toggle-thumb absolute rounded-full"></span>
  </span>
  @if (!hideLabel()) {
    <span class="text-sm text-ink-1">{{ label() }}</span>
  }
</label>
