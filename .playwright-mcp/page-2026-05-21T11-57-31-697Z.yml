              - heading "Honey on my eyes! - super efficient blog app Part 3" [level=2] [ref=e231]
              - generic [ref=e232]: In Part 3, we focus on admin features, editor improvements, and unsaved data protection. We switched from p-editor to Quill, overcoming issues with highlight.js and server-side rendering. Now, syntax highlighting works smoothly. To prevent data loss, we added a before-unload warning and a CanDeactivate guard, prompting users before leaving unsaved work. A new "Save as Draft" feature lets posts be stored without publishing. Editing posts is now seamless with automatic form population when modifying an existing post. We also fixed heading styles in Tailwind and formatted dates properly from Firebase timestamps. Finally, we extended Quill to support TypeScript syntax highlighting. Another step toward making this blog app powerful and efficient! 🚀 Stay tuned for more!
