              - generic [ref=e191]: In this chapter, I set up GitHub Actions to deploy my Angular blog to Cloud Run using a JSON key. I ran into a bunch of permission issues, fixed them step by step, and finally got the deployment working. I added unit tests to block bad deploys, and a PR check workflow for better control. It’s now running smoothly, and I’m ready for the next step.
